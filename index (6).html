<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030816"><title>ASTRA AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: layar penuh ala aplikasi chat. Splash -> login -> tawaran GO ASTRA -> chat. Dark-first, semua teks dan pesan biru; mode putih = latar putih, pesan putih. */
:root{
  --bg:#030816; --bg2:#071230; --card:#0a1838; --card2:#0e2048; --line:#1a3a78;
  --blue:#4da3ff; --text:#6db6ff; --muted:#4f86cc; --accent:#1f6fff; --accent2:#00c2ff;
  --ubub:linear-gradient(135deg,#1c6bff,#0b45c8); --utext:#eaf4ff; --abub:#0a1838;
  --glow:rgba(31,111,255,.35); --ok:#35d49a; --warn:#ffb340; --bad:#ff6b7d; --shadow:0 12px 40px rgba(0,0,0,.5);
  --f-d:'Sora',system-ui,sans-serif; --f-b:'Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#ffffff; --bg2:#f4f8ff; --card:#ffffff; --card2:#eef4ff; --line:#c9dcff;
  --blue:#1558d6; --text:#1558d6; --muted:#4a74c4; --accent:#1558d6; --accent2:#0a8cff;
  --ubub:#ffffff; --utext:#1558d6; --abub:#ffffff; --glow:rgba(21,88,214,.18); --shadow:0 10px 30px rgba(21,88,214,.15); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f4f8ff; --card:#ffffff; --card2:#eef4ff; --line:#c9dcff;
  --blue:#1558d6; --text:#1558d6; --muted:#4a74c4; --accent:#1558d6; --accent2:#0a8cff;
  --ubub:#ffffff; --utext:#1558d6; --abub:#ffffff; --glow:rgba(21,88,214,.18); --shadow:0 10px 30px rgba(21,88,214,.15); color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-b);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.logo-img{display:block;object-fit:contain}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#0a1f55 0%,#030816 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s,visibility .7s;color:#6db6ff}
:root[data-theme="light"] #splash{background:radial-gradient(ellipse at 50% 40%,#e6f0ff 0%,#fff 65%);color:#1558d6}
#splash.out{opacity:0;visibility:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
.orb{position:relative;width:170px;height:170px;display:grid;place-items:center;z-index:1}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#4da3ff;border-right-color:#00c2ff;animation:spin 1.6s linear infinite;filter:drop-shadow(0 0 8px #1f6fff)}
.orb .ring.r2{inset:14px;animation-duration:2.4s;animation-direction:reverse;border-top-color:#1f6fff;border-right-color:transparent;border-left-color:#00c2ff}
.orb .ring.r3{inset:-14px;opacity:.5;animation-duration:4s}
.orb .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#00c2ff;box-shadow:0 0 14px #00c2ff;top:50%;left:50%;margin:-5px;animation:orbit 3s linear infinite}
.orb .dot.d2{animation-delay:-1.5s;background:#4da3ff}
.orb .core{width:104px;height:104px;border-radius:28px;display:grid;place-items:center;background:rgba(14,32,72,.7);box-shadow:0 0 50px var(--glow),inset 0 0 20px rgba(77,163,255,.25);animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 3s 1s ease-in-out infinite;overflow:hidden}
.orb .core img,.orb .core svg{width:84px;height:84px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{from{transform:rotate(0) translateX(96px)}to{transform:rotate(360deg) translateX(96px)}}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-6px)}}
.sname{font-family:var(--f-d);font-weight:800;font-size:clamp(32px,9vw,46px);letter-spacing:.18em;display:flex;gap:.02em;z-index:1}
.sname span{opacity:0;transform:translateY(16px);animation:rise .6s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.stag{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);z-index:1;opacity:0;animation:rise .8s 1.6s forwards}
.sbar{width:min(220px,60vw);height:4px;border-radius:4px;background:rgba(77,163,255,.18);overflow:hidden;z-index:1}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f6fff,#00c2ff);border-radius:4px;animation:load 3.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes load{to{width:100%}}
.sfrom{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.12em;color:var(--muted);z-index:1;text-align:center}
.sfrom b{color:var(--text);font-weight:700}

/* AUTH */
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.authbox{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.authbox .mark{margin:0 auto;width:76px;height:76px;border-radius:22px;background:var(--card2);display:grid;place-items:center;box-shadow:0 0 40px var(--glow);overflow:hidden}
.authbox .mark img,.authbox .mark svg{width:62px;height:62px}
.authbox h1{font-family:var(--f-d);font-size:26px;margin:4px 0 0;letter-spacing:.06em}
.authbox p{margin:0;color:var(--muted);font-size:13.5px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:50px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px var(--glow)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.field input::placeholder{color:var(--muted);opacity:.7}
.btn{height:48px;border-radius:14px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s}
a.btn{text-decoration:none;color:var(--text)}
a.btn.pri{color:#fff}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 24px var(--glow)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sec{border:1px solid var(--line);background:var(--card)}
.btn.sec:hover{border-color:var(--accent2)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.foot{font-size:12px;color:var(--muted);margin-top:8px}

/* APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text);transition:background .2s}
.ibtn:hover{background:var(--card2)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-d);font-weight:800;letter-spacing:.12em;font-size:16px}
.brand .lg{width:28px;height:28px;border-radius:8px;overflow:hidden;display:grid;place-items:center}
.brand .lg img,.brand .lg svg{width:28px;height:28px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600}
.pill.up{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
#chat{flex:1;overflow-y:auto;padding:18px 14px 8px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:5vh 0 6px}
.hero .mark{width:84px;height:84px;border-radius:24px;background:var(--card2);display:grid;place-items:center;box-shadow:0 0 50px var(--glow);overflow:hidden;animation:float 3.5s ease-in-out infinite}
.hero .mark img,.hero .mark svg{width:68px;height:68px}
.hero h2{font-family:var(--f-d);font-size:clamp(22px,5.5vw,30px);margin:6px 0 0}
.hero p{margin:0;color:var(--muted);max-width:420px}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px;width:100%}
.sug{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .15s,border-color .2s}
.sug:hover{border-color:var(--accent2);transform:translateY(-2px)}
.sug .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--accent2);flex:none}
.sug b{display:block;font-size:13.5px}
.sug small{color:var(--muted);font-size:12.5px}
.msg{display:flex;gap:10px;max-width:100%;animation:rise .35s both}
.msg.user{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:10px;background:var(--card2);overflow:hidden;display:grid;place-items:center;flex:none}
.av img,.av svg{width:26px;height:26px}
.bub{min-width:0;max-width:min(88%,640px);padding:11px 15px;border-radius:18px;border:1px solid var(--line);overflow-wrap:anywhere}
.msg.ai .bub{background:var(--abub);border-top-left-radius:6px}
.msg.user .bub{background:var(--ubub);color:var(--utext);border-color:var(--accent);border-top-right-radius:6px;box-shadow:0 6px 20px var(--glow)}
.bub p{margin:0}
.bub ul{margin:6px 0;padding-left:20px}
.bub code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--card2);padding:1px 6px;border-radius:6px}
.codeblk{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.codeblk .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.codeblk pre{margin:0;padding:12px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.cp{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:3px 8px;border-radius:8px}
.cp:hover{background:var(--card2);color:var(--text)}
.cp svg{width:14px;height:14px}
.acts{display:flex;gap:4px;margin-top:6px}
details.think{margin-bottom:8px;border:1px dashed var(--line);border-radius:12px;padding:7px 11px;font-size:13px;color:var(--muted)}
details.think summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
details.think summary::-webkit-details-marker{display:none}
.think ol{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.think li.on::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent2);margin-left:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.spin{animation:spin 1.2s linear infinite}
.dots{display:inline-flex;gap:4px;align-items:center;height:20px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-6px)}}
.att{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.achip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;max-width:230px;color:var(--text)}
.achip .th{width:34px;height:34px;border-radius:8px;background:var(--card);display:grid;place-items:center;overflow:hidden;flex:none}
.achip .th img{width:100%;height:100%;object-fit:cover}
.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.achip button{display:grid;place-items:center;color:var(--muted)}
.imgcard{display:flex;flex-direction:column;gap:10px;min-width:min(260px,70vw)}
.pbar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;transition:width .3s}
.imgcard .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.imgcard .pc{font-family:var(--f-d);font-weight:800;font-size:26px;color:var(--text)}

/* COMPOSER */
footer.comp{padding:8px 14px 12px;background:var(--bg)}
.cbox{max-width:780px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:10px 10px 8px;transition:border-color .2s,box-shadow .2s}
.cbox:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px var(--glow)}
.cbox textarea{width:100%;background:none;border:0;outline:0;resize:none;max-height:150px;min-height:26px;padding:4px 6px;display:block}
.cbox textarea::placeholder{color:var(--muted);opacity:.75}
.crow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.cbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--text);position:relative;transition:background .2s}
.cbtn:hover{background:var(--card2)}
.cbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cbtn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,107,125,.2)}}
.chip{height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.chip:hover{background:var(--card2)}
.send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px var(--glow);transition:transform .15s,opacity .2s}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.4;box-shadow:none}
.meter{max-width:780px;margin:6px auto 0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.meter b{color:var(--text);font-variant-numeric:tabular-nums}
.credit{text-align:center;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.pending{max-width:780px;margin:0 auto 8px}

/* POPUPS */
.pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;min-width:230px;animation:rise .18s both}
.pop button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;text-align:left;font-size:14px}
.pop button:hover{background:var(--card2)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.pop .tag{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.pop .lk{margin-left:auto;color:var(--muted)}
#ov{position:fixed;inset:0;z-index:70;background:rgba(2,6,18,.66);backdrop-filter:blur(4px);display:grid;place-items:center;padding:14px;animation:rise .2s both}
:root[data-theme="light"] #ov{background:rgba(20,40,90,.35)}
.modal{width:min(560px,100%);max-height:92%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(980px,100%)}
.mh{display:flex;align-items:center;gap:10px}
.mh h3{margin:0;font-family:var(--f-d);font-size:19px;flex:1}
.sec-t{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);flex-wrap:wrap}
.setrow small{display:block;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{padding:7px 14px;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin-top:6px;width:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px}
.bar i.hot{background:var(--bad)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:10px;position:relative}
.plan.best{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2),0 10px 30px var(--glow)}
.plan.cur{opacity:.85}
.plan h4{margin:0;font-family:var(--f-d);font-size:15px}
.plan .pr{font-family:var(--f-d);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.plan .pr small{font-size:12px;font-weight:500;color:var(--muted)}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{width:16px;height:16px;color:var(--ok);margin-top:3px}
.plan li.no{color:var(--muted);text-decoration:line-through}
.plan li.no svg{color:var(--muted)}
.ribbon{position:absolute;top:-10px;right:14px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.hrow button.go{flex:1;text-align:left;min-width:0}
.hrow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow small{color:var(--muted)}
.paym{display:grid;gap:8px}
.pm{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;text-decoration:none;color:var(--text);transition:border-color .2s}
.pm:hover{border-color:var(--accent2)}
.pm b{display:block}.pm small{color:var(--muted)}
.pm.off{opacity:.55}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.qrbox img{width:min(300px,100%);height:auto;border-radius:8px}
.qrbox small{color:#35507f}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--accent2);color:var(--text);padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90vw;text-align:center;font-size:13.5px}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* MEDIA */
.media{width:min(340px,76vw);display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.media img,.media video{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:#000}
.media img{cursor:zoom-in}.mslot{min-width:0}.mslot .achip{max-width:100%}
.mcard{border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--text);padding:10px;display:flex;flex-direction:column;gap:8px}
.mcard .mt{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}.mcard .mt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard audio{width:100%;height:40px}.mcard iframe{width:100%;height:300px;border:0;border-radius:8px;background:#fff}
.mcard pre{margin:0;max-height:180px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.mcard .dl{height:38px;font-size:13px;text-decoration:none}
#lb{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:grid;place-items:center}#lb img{max-width:96vw;max-height:88vh;object-fit:contain}

function md(s){
  const blocks=[];if((s.match(/```/g)||[]).length%2)s+='\n```';s=esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{blocks.push(`<div class="codeblk"><div class="hd"><span>${l||'kode'}</span><button class="cp" data-copy>${ic('copy')}Salin kode</button></div><pre><code>${c.replace(/\n$/,'')}</code></pre></div>`);return '\u0000'+(blocks.length-1)+'\u0000'});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const lines=s.split('\n');let out='',inl=false;
  lines.forEach(l=>{l=l.replace(/^#{1,4}\s+(.*)$/,'<b>$1</b>').replace(/^\s*\*\s+/,'- ');if(/^\s*[-•]\s+/.test(l)){if(!inl){out+='<ul>';inl=true}out+='<li>'+l.replace(/^\s*[-•]\s+/,'')+'</li>'}else{if(inl){out+='</ul>';inl=false}out+=l.trim()===''?'<div style="height:6px"></div>':'<p>'+l+'</p>'}});
  if(inl)out+='</ul>';
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]);
}

function fmtSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}
function fmtDur(s){s=Math.round(s);return Math.floor(s/60)+'m '+(s%60)+'s'}
function topWords(txt,n=6){const m={};(txt.toLowerCase().match(/[a-zà-ÿ]{4,}/g)||[]).forEach(w=>{if(!STOP.has(w))m[w]=(m[w]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0])}
function summarize(txt,n=3){
  const sents=(txt.replace(/\s+/g,' ').match(/[^.!?]+[.!?]/g)||[]).map(s=>s.trim()).filter(s=>s.length>25);if(!sents.length)return txt.slice(0,240);
  const f={};(txt.toLowerCase().match(/[a-zà-ÿ]{4,}/g)||[]).forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1});
  const sc=sents.map((s,i)=>({s,i,v:(s.toLowerCase().match(/[a-zà-ÿ]{4,}/g)||[]).reduce((a,w)=>a+(f[w]||0),0)/Math.sqrt(s.length)}));
  return sc.sort((a,b)=>b.v-a.v).slice(0,n).sort((a,b)=>a.i-b.i).map(x=>x.s).join(' ');
}
function loadMedia(file,tag){return new Promise(res=>{const el=document.createElement(tag);el.preload='metadata';el.muted=true;const url=URL.createObjectURL(file);el.onloadedmetadata=()=>res({el,url});el.onerror=()=>{URL.revokeObjectURL(url);res(null)};el.src=url;setTimeout(()=>res(null),6000)})}
function thumbFrom(src,w,h,max=72){const c=document.createElement('canvas');const r=Math.min(max/w,max/h,1);c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));try{c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}catch(e){return null}}
async function addFile(file){
  if(file.size>314572800){toast('File terlalu besar, maksimal 300 MB.');return}
  const a={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),file,name:file.name,size:file.size,type:file.type,kind:'file',info:[],text:''};
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  try{
    if(file.type.startsWith('image/')){a.kind='image';const url=URL.createObjectURL(file);const img=new Image();await new Promise(r=>{img.onload=r;img.onerror=r;img.src=url});
      a.info.push(`Foto ${img.naturalWidth} x ${img.naturalHeight} px, ${fmtSize(file.size)}`);a.thumb=thumbFrom(img,img.naturalWidth,img.naturalHeight);a.vis=thumbFrom(img,img.naturalWidth,img.naturalHeight,1024);
      try{const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(img,0,0,8,8);const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/4;r=r/n;g=g/n;b=b/n;a.info.push('Warna dominan: '+colorName(r,g,b)+', tampak '+((r+g+b)/3>150?'terang':(r+g+b)/3<80?'gelap':'sedang')+(img.naturalWidth>img.naturalHeight?', orientasi lanskap':img.naturalWidth<img.naturalHeight?', orientasi potret':', persegi'))}catch(e){}
      URL.revokeObjectURL(url)}
    else if(file.type.startsWith('video/')){a.kind='video';const m=await loadMedia(file,'video');if(m){const v=m.el;a.info.push(`Video ${v.videoWidth} x ${v.videoHeight}, durasi ${fmtDur(v.duration)}, ${fmtSize(file.size)}`);
      try{v.currentTime=Math.min(1,v.duration/2);await new Promise(r=>{v.onseeked=r;setTimeout(r,1500)});a.thumb=thumbFrom(v,v.videoWidth,v.videoHeight);a.vis=thumbFrom(v,v.videoWidth,v.videoHeight,768)}catch(e){}URL.revokeObjectURL(m.url)}else a.info.push(`Video ${fmtSize(file.size)}`)}
    else if(file.type.startsWith('audio/')){a.kind='audio';const m=await loadMedia(file,'audio');if(m){a.info.push(`Audio durasi ${fmtDur(m.el.duration)}, ${fmtSize(file.size)}`);URL.revokeObjectURL(m.url)}else a.info.push(`Audio ${fmtSize(file.size)}`)}
    else if(/^(txt|md|csv|json|js|html|css|py|log)$/.test(ext)||file.type.startsWith('text/')){a.kind='text';a.text=(await file.text()).slice(0,300000);
      const w=countWords(a.text),ln=a.text.split('\n').length;a.info.push(`Teks ${w} kata, ${ln} baris, ${fmtSize(file.size)}`);

function calcParse(str){
  let i=0;const s=str.replace(/\s+/g,'');
  function num(){const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}
  function pri(){if(s[i]==='('){i++;const v=ex();if(s[i]!==')')throw 0;i++;return pc(v)}if(s[i]==='-'){i++;return -pri()}if(s[i]==='+'){i++;return pri()}return pc(num())}
  function pc(v){while(s[i]==='%'){i++;v/=100}return v}
  function pw(){let b=pri();if(s[i]==='^'){i++;return Math.pow(b,pw())}return b}
  function tm(){let v=pw();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const r=pw();v=o==='*'?v*r:v/r}return v}
  function ex(){let v=tm();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const r=tm();v=o==='+'?v+r:v-r}return v}
  const v=ex();if(i!==s.length)throw 0;return v;
}

   .replace(/(\d+(?:\.\d+)?)\s*(?:persen|%)\s*dari\s*(\d+(?:\.\d+)?)/g,(m,a,b)=>`(${a}/100*${b})`)
   .replace(/\b(ditambah|tambah|plus)\b/g,'+').replace(/\b(dikurangi|dikurang|kurang|minus)\b/g,'-').replace(/\b(dikali|kali)\b/g,'*').replace(/\b(dibagi|bagi)\b/g,'/').replace(/\bpangkat\b/g,'^').replace(/×/g,'*').replace(/÷/g,'/')
   .replace(/(\d)\s*x\s*(?=[\d(])/g,'$1*').replace(/\*\*/g,'^');
  const m=s.match(/[\d(][\d\s.+\-*/^()%]*[\d)]/);if(!m)return null;
  const e=m[0].trim();if(!/[+\-*/^%]/.test(e.replace(/^-/,''))&&!/^\(.*\)$/.test(e))return null;

function classify(raw,att){
  const q=norm(raw);const c={att,math:findMath(raw),kb:null};
  const lk=' '+q+' ';c.kb=KB.find(k=>k[0].some(w=>lk.includes(w.startsWith(' ')?w:w)))&&(/(apa itu|apa sih|jelaskan|pengertian|definisi|maksud|what is|tentang)/.test(q)||q.split(' ').length<=3)?KB.find(k=>k[0].some(w=>lk.includes(w))):null;
  const sc=INTENTS.map(i=>({id:i.id,s:i.score(q,c)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  return {q,c,ranked:sc,top:sc[0]?sc[0].id:'fallback'};
}
function describeAtt(att,q,raw){

    let s=`**${a.name}**\n- ${a.info.join('\n- ')}`;
    if(a.text){const tw=topWords(a.text);if(tw.length)s+=`\n- Kata kunci: ${tw.join(', ')}`;
      if(/(ringkas|rangkum|summary|summarize|inti|isi)/.test(q)||!raw.trim())s+=`\n\n**Ringkasan:** ${summarize(a.text)}`;
      else s+=`\n- Awal isi: "${a.text.replace(/\s+/g,' ').slice(0,140)}..."`}
    return s}).join('\n\n');
  return `File sudah kuterima dan kubaca:\n\n${parts}\n\n${att.some(a=>a.text)?'Mau kuringkas, kucari kata tertentu, atau kuhitung sesuatu dari isinya?':'Beritahu aku apa yang ingin kamu ketahui dari file ini.'}`;
}

function buildThoughts(cl,raw,att,mode){
  const w=countWords(raw);const th=[];
  th.push(`Membaca pesan: ${w} kata${att.length?', '+att.length+' lampiran':''}`);
  th.push(`Mengenali maksud: ${cl.top}${cl.ranked[1]?' (kandidat lain: '+cl.ranked[1].id+')':''}`);
  if(cl.c.math)th.push(`Mengurai ekspresi matematika: ${cl.c.math.e}`);
  if(cl.c.kb)th.push('Mencari di basis pengetahuan: 1 entri cocok');
  else if(cl.top==='fallback')th.push('Mencari di basis pengetahuan: tidak ada entri cocok');
  if(att.length)th.push(`Membaca ${att.length} file: ${att.map(a=>a.kind).join(', ')}`);
  th.push('Menyusun jawaban');
  if(mode==='deep'||mode==='code'){
    if(cl.c.math){let ok=false;try{ok=Math.abs(calcParse(String(cl.c.math.e).replace(/\s+/g,''))-cl.c.math.v)<1e-9}catch(e){}th.push('Memeriksa ulang hitungan: '+(ok?'hasil sama':'perlu dicek'))}
    else th.push('Memeriksa ulang kesesuaian jawaban dengan pertanyaan');
    th.push('Merapikan format jawaban');
  }
  return th;
}

async function send(){

  const raw=inp.value.trim();if(!raw&&!S.pending.length)return;
  const p=plan(),u=usage(),w=countWords(raw);
  if(p.words!==Infinity&&u.words+w>p.words){toast(t('limitW'));openPlans(false);return}
  const sq=imgSearchQ(raw),wantImg=!sq&&(S.imgMode||/(buat|bikin|generate|gambar(kan)?|lukis).*(gambar|foto|image|lukisan|ilustrasi|poster)/i.test(raw));
  if(wantImg&&u.images>=p.images){toast(t('limitI'));return}
  S.busy=true;$('#sendBtn').innerHTML=ic('stop','fill');
  const att=S.pending;S.pending=[];renderPending();
  att.forEach(a=>{if(a.file)MS.put(a.id,a.file)});const um={role:'user',text:raw,att:att.map(a=>({id:a.file?a.id:undefined,name:a.name,kind:a.kind,type:a.type,size:a.size,thumb:a.thumb}))};
  let chat=curChat();if(!chat){chat={id:S.chatId,title:(raw||att[0].name).slice(0,42),ts:Date.now(),msgs:[]};S.chats.unshift(chat)}
  if(!chat.msgs.length)$('#wrap').innerHTML='';
  chat.msgs.push(um);$('#wrap').appendChild(msgEl(um));
  inp.value='';inp.style.height='auto';u.words+=w;saveUsage(u);renderMeter();scrollDown();
  try{
    if(wantImg){u.images++;saveUsage(u);renderMeter();await imageFlow(chat,raw)}
    else if(sq)await imageSearchFlow(chat,sq);
    else await answer(chat,raw,att);
  }catch(e){console.error(e);toast('Terjadi kesalahan, coba lagi.')}
  chat.ts=Date.now();persist();S.busy=false;$('#sendBtn').innerHTML=ic('up');
}

const MS={db:null,mem:{},
 open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('astra-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async put(id,b){this.mem[id]=b;try{const d=await this.open();d.transaction('f','readwrite').objectStore('f').put(b,id)}catch(e){}},
 async get(id){if(this.mem[id])return this.mem[id];try{const d=await this.open();return await new Promise(res=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}},
 async del(id){delete this.mem[id];try{(await this.open()).transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}};
const urls={};
async function mediaURL(id){if(urls[id])return urls[id];const b=await MS.get(id);return b?(urls[id]=URL.createObjectURL(b)):null}
function purge(cs){(cs||[]).forEach(c=>c.msgs.forEach(m=>(m.att||[]).forEach(a=>{if(a.id){MS.del(a.id);if(urls[a.id]){URL.revokeObjectURL(urls[a.id]);delete urls[a.id]}}})))}
function mediaType(a){const e=(a.name.split('.').pop()||'').toLowerCase(),t=a.type||'';if(t.startsWith('image/'))return 'image';if(t.startsWith('video/'))return 'video';if(t.startsWith('audio/'))return 'audio';if(e==='pdf'||t==='application/pdf')return 'pdf';if(a.kind==='text'||/^(txt|md|csv|json|js|html|css|py|log)$/.test(e))return 'text';return 'file'}
function lightbox(url){const o=document.createElement('div');o.id='lb';o.innerHTML=`<button class="ibtn" aria-label="Tutup">${ic('x')}</button><img src="${url}" alt="">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
async function hydrate(d,att){
  for(const a of att){if(!a.id)continue;const slot=d.querySelector(`[data-mid="${a.id}"]`);if(!slot)continue;
    const url=await mediaURL(a.id),k=mediaType(a),n=esc(a.name);
    if(!url){slot.innerHTML=`<div class="mcard"><div class="mt">${ic('file')}<span>${n}</span></div><small style="color:var(--muted)">File ini sudah tidak tersimpan di browser.</small></div>`;continue}
    if(k==='image'){slot.innerHTML=`<img src="${url}" alt="${n}" loading="lazy">`;slot.firstChild.onclick=()=>lightbox(url)}
    else if(k==='video')slot.innerHTML=`<video src="${url}#t=0.1" controls playsinline preload="metadata"></video>`;
    else if(k==='audio')slot.innerHTML=`<div class="mcard"><div class="mt">${ic('audio')}<span>${n}</span></div><audio src="${url}" controls preload="metadata"></audio></div>`;
    else if(k==='pdf')slot.innerHTML=`<div class="mcard"><div class="mt">${ic('file')}<span>${n}</span></div><iframe src="${url}"></iframe><a class="btn sec dl" href="${url}" target="_blank" rel="noopener">Buka layar penuh</a></div>`;
    else if(k==='text'){const b=await MS.get(a.id),tx=b?(await b.text()).slice(0,6000):'';slot.innerHTML=`<div class="mcard"><div class="mt">${ic('file')}<span>${n}</span></div><pre>${esc(tx)}</pre></div>`}
    else slot.innerHTML=`<div class="mcard"><div class="mt">${ic('file')}<span>${n}</span></div><a class="btn sec dl" href="${url}" download="${n}">Unduh</a></div>`}
}

  S.chats.filter(c=>c.msgs.length).forEach(c=>{const r=document.createElement('div');r.className='hrow';r.innerHTML=`<button class="go">${ic('chat')}<b>${esc(c.title)}</b><small>${new Date(c.ts).toLocaleString(S.lang==='en'?'en-US':'id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${c.msgs.length}</small></button><button class="ibtn" aria-label="Hapus">${ic('trash')}</button>`;
    r.querySelector('.go').onclick=()=>{S.chatId=c.id;renderChat(c.msgs);closeModal()};
    r.querySelector('.ibtn').onclick=()=>{purge([c]);S.chats=S.chats.filter(x=>x.id!==c.id);persist();r.remove();if(S.chatId===c.id)newChat()};
    hl.appendChild(r)});
}
function openSettings(scroll){
  const p=plan(),u=usage();const sz=DB.size();const quota=5*1024*1024;
  const barRow=(lbl,used,max,fmt)=>{const pc=max===Infinity?0:Math.min(100,used/max*100);return `<div class="setrow" style="display:block"><div style="display:flex;justify-content:space-between"><b>${lbl}</b><span>${fmt?fmt(used):used} / ${max===Infinity?'∞':(fmt?fmt(max):max)}</span></div><div class="bar"><i class="${pc>90?'hot':''}" style="width:${pc}%"></i></div></div>`};
  const o=modal(`<div class="mh"><h3>${t('settings')}</h3><button class="ibtn" data-close>${ic('x')}</button></div>
   <div class="sec-t">${t('theme')}</div>
   <div class="setrow"><span>${t('theme')}</span><div class="seg" id="thSeg"><button data-v="dark" class="${S.theme==='dark'?'on':''}">${t('dark')}</button><button data-v="light" class="${S.theme==='light'?'on':''}">${t('light')}</button></div></div>
   <div class="sec-t">${t('lang')}</div>
   <div class="setrow"><span>${t('lang')}</span><select id="lgSel"><option value="id" ${S.lang==='id'?'selected':''}>Bahasa Indonesia</option><option value="en" ${S.lang==='en'?'selected':''}>English</option></select></div>
   <div class="sec-t">Otak AI</div>
   <div class="setrow" style="display:block"><select id="aiProv" style="width:100%"><option value="auto">Online gratis (tanpa API key)</option><option value="custom">API sendiri (OpenAI / Anthropic)</option><option value="local">Mesin lokal saja (offline)</option></select>
   <div id="aiCust" hidden style="display:grid;gap:8px;margin-top:10px"><label class="field"><input id="aiUrl" placeholder="Endpoint, mis. https://api.openai.com/v1/chat/completions"></label><label class="field"><input id="aiKey" type="password" placeholder="API key"></label><label class="field"><input id="aiModel" placeholder="Model, mis. gpt-4o-mini"></label></div>
   <label class="field" style="margin-top:10px"><input id="aiTav" type="password" placeholder="Tavily API key (opsional, pencarian web penuh)"></label>
   <small style="display:block;color:var(--muted);margin-top:8px">Tanpa Tavily, pencarian memakai Wikipedia dan GDELT (berita dari media terverifikasi). Key Tavily gratis di tavily.com. Semua key hanya disimpan di browser ini.</small></div>
   <div class="sec-t" id="stor">${t('storage')}</div>
   ${barRow(t('words'),u.words,p.words)}${barRow(t('images'),u.images,p.images)}${barRow('Penyimpanan lokal',sz,quota,fmtSize)}
   <div class="setrow"><span>${t('cur')}<small>${p.name} · ${p.price}${p.per}${S.user.planExp?' · sampai '+new Date(S.user.planExp).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):''}</small></span><button class="btn pri" id="upBtn" style="height:40px">${ic('crown')}${t('upgrade')}</button></div>
   <div class="setrow"><span>Akun<small>${esc(S.user.email)}</small></span></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" id="clrBtn" style="flex:1">${ic('trash')}${t('clear')}</button><button class="btn sec" id="rstBtn" style="flex:1">${t('reset')}</button></div>`);
  o.querySelectorAll('#thSeg button').forEach(b=>b.onclick=()=>{setTheme(b.dataset.v);o.querySelectorAll('#thSeg button').forEach(x=>x.classList.toggle('on',x===b))});
  o.querySelector('#lgSel').onchange=e=>{S.lang=e.target.value;saveSettings();applyI18n();refreshChrome();if(!S.chats.length||!curChat()||!curChat().msgs.length)renderChat([]);openSettings()};
  o.querySelector('#upBtn').onclick=()=>openPlans(false);
  {const c=DB.get('ai',{}),pv=o.querySelector('#aiProv'),cu=o.querySelector('#aiCust');pv.value=c.provider||'auto';o.querySelector('#aiUrl').value=c.url||'';o.querySelector('#aiKey').value=c.key||'';o.querySelector('#aiModel').value=c.model||'';o.querySelector('#aiTav').value=c.tav||'';cu.hidden=pv.value!=='custom';
   const sv=()=>{DB.set('ai',{provider:pv.value,url:o.querySelector('#aiUrl').value.trim(),key:o.querySelector('#aiKey').value.trim(),model:o.querySelector('#aiModel').value.trim(),tav:o.querySelector('#aiTav').value.trim()});cu.hidden=pv.value!=='custom'};
   o.querySelectorAll('#aiProv,#aiUrl,#aiKey,#aiModel,#aiTav').forEach(e=>e.onchange=sv)}
  o.querySelector('#clrBtn').onclick=e=>{const b=e.currentTarget;if(!b.dataset.s){b.dataset.s=1;b.textContent='Ketuk lagi untuk menghapus';return}purge(S.chats);S.chats=[];persist();newChat();closeModal();toast('Semua chat dihapus')};
  o.querySelector('#rstBtn').onclick=e=>{const b=e.currentTarget;if(!b.dataset.s){b.dataset.s=1;b.textContent='Ketuk lagi untuk reset';return}['chats:','usage:','mem:'].forEach(k=>DB.del(k+S.user.email));S.user.plan='free';saveUser();purge(S.chats);S.chats=[];newChat();refreshChrome();closeModal();toast('Data akun direset')};
  if(scroll)o.querySelector('#stor').scrollIntoView();
}
function openPlans(first){
  const o=modal(`<div class="mh"><h3>${first?'Upgrade ke GO ASTRA':'GO ASTRA Premium'}</h3><button class="ibtn" data-close>${ic('x')}</button></div>
   <p style="margin:-6px 0 0;color:var(--muted)">${first?'Batas lebih besar, mode berpikir lebih dalam, dan upload video. Kamu juga bisa lanjut dengan paket Gratis.':'Setiap paket punya batas dan fitur yang berbeda.'}</p>
   <div class="plans">${PLANS.map(p=>`<div class="plan ${p.best?'best':''} ${p.id===plan().id?'cur':''}">${p.best?'<span class="ribbon">Populer</span>':''}<h4>${p.name}</h4><div class="pr">${p.price}<small> ${p.per}</small></div><ul>${p.feat.map(f=>`<li class="${f[1]?'':'no'}">${ic(f[1]?'check':'x')}${f[0]}</li>`).join('')}</ul><button class="btn ${p.id==='free'||!avail(p)?'sec':'pri'}" data-p="${p.id}">${p.id===plan().id?t('cur'):p.id==='free'?'Tetap Gratis':avail(p)?t('choose'):'Belum tersedia'}</button></div>`).join('')}</div>
   <div class="sec-t">Kode redeem</div>${redeemHTML()}
   <button class="btn sec" data-close>${first?'Nanti saja':t('close')}</button>`,'wide');
  bindRedeem(o);
  o.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const id=b.dataset.p;const p=PLANS.find(x=>x.id===id);if(id===plan().id||id==='free'){closeModal();return}if(!avail(p)){toast(p.name+' belum tersedia.');return}openPay(id)});
}
function redeemHTML(){return `<div class="setrow" style="display:block"><div class="field" style="height:46px"><svg class="i" viewBox="0 0 24 24">${IC.key}</svg><input class="rdIn" type="text" placeholder="ASTRA-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><div class="err rdErr"></div><button class="btn pri rdBtn" style="width:100%">${ic('check')}Tukar kode</button><small style="display:block;color:var(--muted);margin-top:8px">Kode didapat dari ${AGENT} setelah pembayaran. Satu kode hanya bisa dipakai sekali per akun.</small></div>`}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function bindRedeem(o){
  const inp=o.querySelector('.rdIn'),err=o.querySelector('.rdErr'),btn=o.querySelector('.rdBtn');
  inp.addEventListener('input',()=>{err.textContent='';inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9-]/g,'')});
  btn.onclick=async()=>{
    const c=inp.value.trim().toUpperCase();
    if(!/^ASTRA-([A-Z0-9]{5}-){3}[A-Z0-9]{5}$/.test(c)){err.textContent='Format kode belum benar.';return}
    let h;try{h=await sha('astra-v1|'+c)}catch(e){err.textContent='Browser ini tidak mendukung verifikasi kode. Buka lewat https atau browser lain.';return}
    const pid=CODES[h];
    const mine=S.user.redeemed||[];const all=DB.get('redeemed',[]);
    if(!pid){err.textContent='Kode tidak valid.';return}
    if(mine.includes(h)){err.textContent='Kode ini sudah pernah dipakai di akunmu.';return}
    if(all.includes(h)){err.textContent='Kode ini sudah dipakai.';return}
    const p=PLANS.find(x=>x.id===pid);
    S.user.redeemed=[...mine,h];S.user.plan=pid;S.user.planExp=Date.now()+p.days*864e5;saveUser();DB.set('redeemed',[...all,h]);
    if(!p.modes.includes(S.mode))S.mode='fast';saveSettings();closeModal();refreshChrome();toast(p.name+' aktif selama '+p.days+' hari');
  };
}
function waLink(p){return 'https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(`Halo ${AGENT}, saya ingin membeli ${p.name} (${p.price}${p.per}) untuk ASTRA AI.\nEmail akun: ${S.user.email}\nBerikut bukti pembayaran saya:`)}
function openPay(id){
  const p=PLANS.find(x=>x.id===id);const pay=p.pay||{};
  const o=modal(`<div class="mh"><h3>Bayar ${p.name}</h3><button class="ibtn" data-close>${ic('x')}</button></div>
   <div class="setrow"><span><b>${p.name}</b><small>Aktif ${p.days} hari</small></span><span class="pr" style="font-family:var(--f-d);font-weight:800;font-size:20px">${p.price}<small style="font-size:12px;color:var(--muted);font-weight:500"> ${p.per}</small></span></div>
   <div class="sec-t">1. Pilih metode</div>
   <div class="paym">
     ${pay.dana?`<a class="pm" href="${pay.dana}" target="_blank" rel="noopener">${ic('link')}<span><b>DANA</b><small>Buka link pembayaran DANA</small></span></a>`:`<button class="pm off" data-na="DANA">${ic('link')}<span><b>DANA</b><small>Belum tersedia</small></span></button>`}
     ${pay.qris?`<button class="pm" id="qrBtn">${ic('image')}<span><b>QRIS</b><small>Tampilkan kode QR</small></span></button>`:`<button class="pm off" data-na="QRIS">${ic('image')}<span><b>QRIS</b><small>Belum tersedia</small></span></button>`}
     <a class="pm" href="${waLink(p)}" target="_blank" rel="noopener">${ic('chat')}<span><b>Bayar langsung ke agen</b><small>${AGENT}</small></span></a>
   </div>
   <div id="qrBox" hidden class="qrbox"><img id="qrImg" alt="QRIS ${p.name}" src="${pay.qris||''}"><a id="qrLink" class="btn sec" href="${pay.qris||'#'}" target="_blank" rel="noopener" hidden>Buka gambar QRIS</a><small>Scan dengan aplikasi e-wallet atau mobile banking, bayar tepat ${p.price}.</small></div>
   <div class="sec-t">2. Konfirmasi ke agen</div>
   <div class="setrow" style="display:block"><p style="margin:0 0 10px">Setelah membayar, kirim bukti pembayaran dan email akunmu ke ${AGENT}. Agen akan membalas dengan kode redeem.</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn pri" style="flex:1;text-decoration:none" href="${waLink(p)}" target="_blank" rel="noopener">${ic('chat')}Chat WhatsApp</a><button class="btn sec" id="cpWa" style="flex:1">${ic('copy')}${WA_SHOW}</button></div></div>
   <div class="sec-t">3. Masukkan kode redeem</div>${redeemHTML()}
   <button class="btn sec" data-close>${t('close')}</button>`);
  o.querySelectorAll('[data-na]').forEach(b=>b.onclick=()=>toast('Pembayaran '+b.dataset.na+' untuk '+p.name+' belum tersedia.'));
  const qb=o.querySelector('#qrBtn');if(qb)qb.onclick=()=>o.querySelector('#qrBox').hidden=!o.querySelector('#qrBox').hidden;
  const im=o.querySelector('#qrImg');im.onerror=()=>{im.hidden=true;o.querySelector('#qrLink').hidden=false};
  o.querySelector('#cpWa').onclick=()=>copyText(WA_SHOW);
  bindRedeem(o);
}
document.addEventListener('DOMContentLoaded',()=>{});
applyIcons();applyLogo();
</script>
